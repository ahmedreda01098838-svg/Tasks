<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة المهام اليومية</title>
  
  <!-- ملف الأنماط -->
  <link rel="stylesheet" href="style.css">
  
  <!-- مكتبات SweetAlert2 و Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- الهيدر العلوي -->
  <header class="header">
    <h1>📌 نظام إدارة المهام</h1>
    <div class="user-info">
      <div id="auth-section">
        <button id="login-btn" class="login-btn" onclick="loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/>
          </svg>
          تسجيل الدخول
        </button>
      </div>
      <button class="add-day-btn" onclick="addNewDay()">➕ يوم جديد</button>
    </div>
  </header>

  <!-- لوحة الإحصائيات -->
  <section class="dashboard-panel">
    <div class="stat-card">
      <span class="stat-title">إجمالي الأيام</span>
      <span id="stat-total-days" class="stat-value">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-title">إجمالي المهام</span>
      <span id="stat-total-tasks" class="stat-value">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-title">نسبة الإنجاز العامة</span>
      <span id="stat-completion-rate" class="stat-value">0%</span>
    </div>
  </section>

  <!-- شريط البحث -->
  <div class="search-bar-container">
    <input type="text" id="search-input" placeholder="🔍 ابحث في المهام أو التواريخ..." oninput="filterTasks()">
  </div>

  <!-- حاوية الأيام والمهام -->
  <main class="week-container" id="tasks-container">
    <!-- يتم إنشاؤه ديناميكياً بواسطة JavaScript -->
  </main>

  <!-- ملف السكريبت البرمجي -->
  <script type="module" src="script.js"></script>

</body>
</html>
