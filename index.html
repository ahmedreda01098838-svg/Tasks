<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم المهام اليومية</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <h1>📌 منظم المهام</h1>
        <div class="user-profile" id="user-profile">
            <!-- سيتم تحميل زر الدخول أو صورة المستخدم هنا عبر JS -->
        </div>
    </header>

    <!-- Dashboard Panel -->
    <div class="dashboard-panel" id="dashboard-panel" style="display: none;">
        <div class="stat-card">
            <span class="stat-title">إجمالي المهام</span>
            <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-title">المهام المكتملة</span>
            <span class="stat-value" id="stat-completed">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-title">نسبة الإنجاز</span>
            <span class="stat-value" id="stat-ratio">0%</span>
        </div>
    </div>

    <!-- Search Bar & Controls -->
    <div class="search-bar-container" id="search-container" style="display: none;">
        <input type="text" id="search-input" placeholder="🔍 ابحث في المهام أو التواريخ..." oninput="filterTasks()">
    </div>

    <!-- Main Content Container -->
    <main class="week-container" id="tasks-container">
        <!-- سيتم توليد الأيام والمهام هنا تلقائياً -->
    </main>

    <!-- Floating Action / Scroll Top Button -->
    <button class="scroll-top-btn" onclick="scrollToTop()" title="للأعلى">⬆</button>

    <script src="script.js"></script>
</body>
</html>
