<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم المهام اليومية</title>
    
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <link rel="stylesheet" href="style.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script defer src="script.js"></script>
</head>
<body>

    <header class="header">
        <h1>📌Tasks(aamd)</h1>
        <div class="user-profile" id="user-profile"></div>
    </header>

    <div class="dashboard-panel" id="dashboard-panel" style="display: none;">
        <div class="stat-card">
            <span class="stat-title">إجمالي المهام</span>
            <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-title">المهام المكتملة</span>
            <span class="stat-value" id="stat-completed">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-title">نسبة الإنجاز</span>
            <span class="stat-value" id="stat-ratio">0%</span>
        </div>
    </div>

    <div class="search-bar-container" id="search-container" style="display: none;">
        <input type="text" id="search-input" placeholder="🔍 ابحث في المهام أو التواريخ..." oninput="filterTasks()">
    </div>

    <main class="week-container" id="tasks-container">
        <p id="loading-spinner" style="text-align:center; color: var(--text-muted); margin-top: 40px;">جاري تحميل المهام...</p>
    </main>

    <!-- زر تحميل المزيد من الأيام القديمة -->
    <div style="width: 100%; max-width: 700px; text-align: center; margin: 20px 0;">
        <button id="load-more-btn" onclick="loadMoreTasks()" style="display: none; margin: 0 auto; background: var(--card-bg); color: var(--text); border: 1px solid var(--border-color); padding: 12px 24px;">
            📥 عرض الأيام السابقة
        </button>
    </div>

    <button class="scroll-top-btn" onclick="scrollToTop()" title="للأعلى">⬆</button>

</body>
</html>
